image:
  repository: ghcr.io/baursuck/surge-links
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

database:
  # On AWS: no password at all. Pods log in as app_user with an IAM token (DB_IAM_AUTH).
  # Fill host from the Terraform output `db_endpoint`.
  url: ""          # e.g. postgresql+asyncpg://app_user@<db_endpoint>/surge_links
  iamAuth: true
  # Alternative for non-AWS clusters: take DATABASE_URL (with password) from a Secret.
  existingSecret: ""
  secretKey: DATABASE_URL

# POST /api/v1/links requires X-API-Key. The Secret is created outside the chart
# (External Secrets / sealed secret), never stored in values.
apiKey:
  existingSecret: surge-links-api
  secretKey: API_KEY

config:
  PUBLIC_BASE_URL: https://go.example.com
  AWS_REGION: eu-central-1
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  CLICK_FLUSH_INTERVAL_SECONDS: "1"
  LOG_LEVEL: INFO

serviceAccount:
  # IRSA: the Terraform output `app_role_arn` (allows rds-db:connect as app_user).
  roleArn: ""

# Security groups for pods (VPC CNI): attach the Terraform output `app_security_group_id`,
# the only source the database accepts.
securityGroupPolicy:
  enabled: false
  securityGroupIds: []

resources:
  requests: {cpu: 250m, memory: 128Mi}
  limits: {memory: 256Mi}   # no CPU limit: throttling hurts p99 more than it saves

# Spike profile: scale up immediately and aggressively, scale down slowly.
# maxReplicas x (DB_POOL_SIZE + DB_MAX_OVERFLOW) must fit RDS max_connections (docs/capacity.md).
autoscaling:
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  maxUnavailable: 1

migrations:
  enabled: true

service:
  port: 80

ingress:
  enabled: false
  className: alb
  host: go.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz

# Needs the Prometheus Operator CRDs in the cluster.
serviceMonitor:
  enabled: false
  interval: 15s
