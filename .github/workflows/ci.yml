name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: app (lint + tests on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: surge
          POSTGRES_PASSWORD: surge
          POSTGRES_DB: surge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surge" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://surge:surge@localhost:5432/surge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  terraform:
    name: terraform (fmt, validate, tests, lint, security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
      - run: terraform fmt -check -recursive infra/terraform
      - name: module tests (mocked AWS, plan only)
        working-directory: infra/terraform/modules/service-env
        run: terraform init -input=false && terraform test
      - name: validate environments
        run: |
          for dir in infra/terraform/envs/* infra/terraform/bootstrap/* infra/terraform/modules/service-env/examples/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v5
      - run: tflint --init --config "$PWD/.tflint.hcl" && tflint --recursive --config "$PWD/.tflint.hcl"
      - name: security scan (trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  helm:
    name: helm (lint + schema check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/surge-links
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template demo deploy/helm/surge-links | ./kubeconform -strict -summary

  e2e:
    name: e2e (compose, k6 smoke + spike, DR drill)
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v5
      - name: start stack
        run: |
          docker compose up -d --build postgres app prometheus
          for i in $(seq 1 60); do curl -sf localhost:8000/readyz && break; sleep 2; done
          curl -sf localhost:8000/readyz
      - name: k6 smoke
        run: SCENARIO=smoke docker compose --profile load run --rm -e SCENARIO=smoke k6
      - name: k6 spike (numbers are from a shared CI runner, not production hardware)
        run: docker compose --profile load run --rm k6
        continue-on-error: true
      - name: DR drill
        run: ./scripts/dr-drill.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: load/results/
      - if: failure()
        run: docker compose logs
